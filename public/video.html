
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频预览与切片 · XIGEMBiliREC</title>
  
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
  
  <script>
    document.documentElement.setAttribute('data-theme', (function(){
      try {
        var t = localStorage.getItem('xigem-theme');
        return t === 'dark' ? 'dark' : 'light';
      } catch(e) { return 'light'; }
    })());
  </script>
  
  <style>
    /* 文件信息栏 */
    .video-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .video-meta-left,
    .video-meta-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .video-meta-right {
      margin-left: auto;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      white-space: nowrap;
      text-decoration: none;
    }

    .meta-pill-dark-text {
      color: #222 !important;
    }

    .nickname-pill {
      color: var(--color-blurple);
      text-decoration: none !important;
    }

    .nickname-pill:hover {
      text-decoration: none !important;
      opacity: 0.85;
    }

    [data-theme="dark"] .nickname-pill {
      color: var(--color-champagne);
    }

    /* 视频预览布局 */
    .video-layout {
      display: flex;
      margin-bottom: 24px;
    }

    @media (max-width: 900px) {
      .video-layout {
        flex-direction: column;
      }
    }

    /* 视频容器 */
    .video-left {
      flex: 1;
      min-width: 0;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--radius-inputs);
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-recessed);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .video-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      background: var(--surface-base);
      text-align: center;
      padding: 24px;
      border-radius: var(--radius-inputs);
    }

    .video-error .empty-title {
      font-size: var(--text-body-lg);
      color: var(--color-text);
      margin-bottom: 8px;
    }

    /* 二级卡片 */
    .clip-control-panel {
      background: var(--surface-base);
      border-radius: var(--radius-cards);
      padding: 24px;
      box-shadow: var(--shadow-recessed);
    }

    [data-theme="dark"] .clip-control-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: none;
    }

    /* 时间轴样式 */
    .timeline-wrapper {
      margin: 0;
      user-select: none;
    }

    .tl-track-container {
      position: relative;
      height: 48px;
      background: var(--surface-sunken);
      border-radius: var(--radius-inputs);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      cursor: pointer;
    }

    [data-theme="light"] .tl-track-container {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.1);
    }

    [data-theme="dark"] .tl-track-container {
      background: rgba(255,255,255,0.05);
    }

    .tl-selection {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(109, 93, 252, 0.2);
      border-top: 2px solid var(--color-blurple);
      border-bottom: 2px solid var(--color-blurple);
      pointer-events: none;
    }

    [data-theme="dark"] .tl-selection {
      background: rgba(228, 184, 99, 0.15);
      border-color: var(--color-champagne);
    }

    .tl-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 10;
    }

    .tl-playhead::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
    }

    .tl-handle {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 12px;
      background: var(--color-blurple);
      border-radius: 4px;
      cursor: ew-resize;
      transform: translateX(-50%);
      z-index: 5;
    }

    .tl-handle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 16px;
      background: rgba(255,255,255,0.5);
    }

    [data-theme="dark"] .tl-handle {
      background: var(--color-champagne);
    }

    /* 时间输入网格 */
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .time-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div data-include="header"></div>

  <main class="page-main">
    <div class="container">
      
      <!-- 顶部标题区 -->
      <div class="flex justify-between items-center mb-24" style="flex-wrap: wrap; gap:16px;">
        <div>
          <p class="label">Video Preview</p>
          <h1 class="heading" id="pageTitle" style="margin:0;">视频预览</h1>
          <div class="info-header" id="fileInfo">加载中...</div>
        </div>
        <div>
          <a href="/list" class="btn">返回媒体库</a>
        </div>
      </div>

      <!-- 播放器与控制台大卡片 -->
      <div class="card card-static" style="padding: 24px;">
        
        <!-- 文件信息栏：状态靠左，大小和时间靠右 -->
        <div class="video-meta-bar">
          <div class="video-meta-left">
            <span class="badge badge-ready" id="badgeStatus">未知</span>
          </div>

          <div class="video-meta-right">
            <span class="badge meta-pill meta-pill-dark-text" id="statSize">- MB</span>
            <span class="badge meta-pill meta-pill-dark-text" id="statDate">-</span>
          </div>
        </div>

        <!-- 视频预览区 -->
        <div class="video-layout">
          <div class="video-left">
            <div class="video-container" id="videoContainer">
              <video id="videoPlayer" controls preload="metadata"></video>
              <div class="video-error hidden" id="videoError">
                <div class="empty-icon">◌</div>
                <div class="empty-title">视频不见了</div>
                <div id="errorMsg">请检查链接是否完整，或者原片是否已被删除。</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 下半部分：切片操作台 -->
        <section id="clipSection">
          <div class="flex justify-between items-center mb-16">
            <h2 class="subheading" style="margin:0;">视频切片</h2>
          </div>

          <div class="clip-control-panel">
            
            <!-- 时间轴（包含工具栏按钮） -->
            <div class="timeline-wrapper" id="timelineContainer">
              <!-- 由 JS 动态渲染 -->
            </div>

            <div class="form-group time-grid" style="margin-bottom: 0; margin-top: 24px;">
              <div>
                <label>开始时间</label>
                <input type="text" id="startTime" placeholder="0:00.00.00">
              </div>
              <div>
                <label>结束时间</label>
                <input type="text" id="endTime" placeholder="0:00.00.00">
              </div>
            </div>
            
          </div>
        </section>
      </div>

    </div>
  </main>

  <div data-include="footer"></div>
  
  <script src="/theme.js"></script>
  <script src="/timeline.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      let fileId = urlParams.get('file') || urlParams.get('id') || urlParams.get('');

      if (!fileId) {
        showFatalError('视频不见了', '缺少文件参数，请从列表重新进入。');
        return;
      }

      const match = fileId.match(/^([a-zA-Z0-9_-]+)_(\d{8})_(\d+)$/);
      if (!match) {
        showFatalError('视频不见了', '文件 ID 格式不正确，请从列表重新进入。');
        return;
      }

      const roomId = match[1];

      document.getElementById('pageTitle').textContent = fileId;

      const video = document.getElementById('videoPlayer');
      const errorEl = document.getElementById('videoError');
      const hlsUrl = `${XIGEM.BASE}stream/${roomId}/${fileId}/index.m3u8`;

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) showPlaybackError();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = hlsUrl;
        video.addEventListener('error', showPlaybackError);
      } else {
        showPlaybackError();
      }

      function showPlaybackError() {
        video.classList.add('hidden');
        errorEl.classList.remove('hidden');
        document.getElementById('errorMsg').textContent = '可能原片还在转码中，或者 HLS 预览文件不存在。';
      }

      function showFatalError(title, msg) {
        document.getElementById('pageTitle').textContent = '错误';
        document.getElementById('fileInfo').innerHTML = '';
        video.classList.add('hidden');
        errorEl.classList.remove('hidden');
        document.querySelector('.video-error .empty-title').textContent = title;
        document.getElementById('errorMsg').textContent = msg;
        document.getElementById('clipSection').classList.add('hidden');
      }

      let timeline = null;
      let isAdmin = false;
      let currentQuota = { count: 0, limit: 0 };

      try {
        const me = await XIGEM.api('/api/me');
        isAdmin = me.username === '#admin#';
        
        if (isAdmin) {
          document.getElementById('clipSection').classList.add('hidden');
        } else {
          const stats = await XIGEM.api('/api/stats/today');
          currentQuota = stats;
        }

        const listRes = await XIGEM.api('/api/recordings');
        const fileData = listRes.items.find(f => f.fileId === fileId);
        
        if (fileData) {
          const nick = fileData.nick || '未知主播';
          const biliLink = `https://live.bilibili.com/${roomId}`;

          document.getElementById('fileInfo').innerHTML = `
            <a href="${biliLink}" target="_blank" class="badge meta-pill nickname-pill">${XIGEM.escapeHtml(nick)}</a>
            <span>房间 ID: ${roomId}</span>
          `;

          const badge = document.getElementById('badgeStatus');
          badge.textContent = fileData.status.toUpperCase();
          badge.className = `badge badge-${fileData.status}`;

          const bytes = fileData.size;
          const k = 1024;
          const sizes = ['B', 'KB', 'MB', 'GB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          document.getElementById('statSize').textContent = parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];

          document.getElementById('statDate').textContent = new Date(fileData.createdAt).toLocaleDateString();

          if (fileData.status !== 'ready') {
            // 如果不 ready，不初始化时间轴
          } else if (!isAdmin) {
            // 1. 初始化时间轴实例
            timeline = new TimelineEditor({
              container: document.getElementById('timelineContainer'),
              video: video,
              inputStart: document.getElementById('startTime'),
              inputEnd: document.getElementById('endTime')
            });

            // 2. 填充配额，显示提交按钮
            timeline.statQuota.textContent = `${currentQuota.count} / ${currentQuota.limit}`;
            timeline.btnClip.style.display = 'inline-block';

            // 3. 绑定提交按钮事件
            timeline.btnClip.addEventListener('click', async () => {
              const startRaw = document.getElementById('startTime').value.trim();
              const endRaw = document.getElementById('endTime').value.trim();

              if (!startRaw || !endRaw) {
                XIGEM.toast('请输入开始和结束时间', 'error');
                return;
              }

              // 转换为后端认识的 HH:MM:SS 格式
              const start = window.toBackendFormat ? window.toBackendFormat(startRaw) : startRaw;
              const end = window.toBackendFormat ? window.toBackendFormat(endRaw) : endRaw;

              timeline.btnClip.disabled = true;
              timeline.btnClip.textContent = '提交中...';
              timeline.btnDownload.style.display = 'none';

              try {
                const res = await XIGEM.api('/api/clip', {
                  method: 'POST',
                  body: JSON.stringify({ roomId, fileId, start, end })
                });

                if (res.ok) {
                  timeline.btnClip.textContent = '排队中...';
                  pollTask(res.taskId);
                }
              } catch (e) {
                XIGEM.toast(e.message || '提交失败', 'error');
                timeline.btnClip.disabled = false;
                timeline.btnClip.textContent = '提交切片';
              }
            });
          }
        } else {
          showFatalError('视频不见了', '后端记录中找不到此文件，可能已被自动清理或删除。');
        }
      } catch (e) {
        console.error('获取数据失败', e);
      }

      async function pollTask(taskId) {
        try {
          const res = await XIGEM.api(`/api/clip/${taskId}/status`);
          
          if (res.status === 'queued' || res.status === 'running') {
            timeline.btnClip.textContent = res.status === 'queued' ? '排队中...' : '正在切片...';
            setTimeout(() => pollTask(taskId), 2000);
          } else if (res.status === 'done') {
            XIGEM.toast('切片完成', 'success');
            
            // 恢复提交按钮，并显示下载按钮
            timeline.btnClip.disabled = false;
            timeline.btnClip.textContent = '提交切片';
            
            timeline.btnDownload.style.display = 'inline-flex';
            timeline.btnDownload.href = XIGEM.BASE + res.downloadUrl.replace(/^\//, '');
            timeline.btnDownload.setAttribute('download', res.outName);
            
            // 刷新配额
            const stats = await XIGEM.api('/api/stats/today');
            timeline.statQuota.textContent = `${stats.count} / ${stats.limit}`;
            
          } else if (res.status === 'failed') {
            XIGEM.toast('切片失败：' + (res.error || '未知错误'), 'error');
            timeline.btnClip.disabled = false;
            timeline.btnClip.textContent = '提交切片';
          }
        } catch (e) {
          XIGEM.toast('轮询状态失败', 'error');
          timeline.btnClip.disabled = false;
          timeline.btnClip.textContent = '提交切片';
        }
      }
    });
  </script>
</body>
</html>
