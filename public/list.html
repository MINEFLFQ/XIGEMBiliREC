
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>录屏切片列表 · XIGEMBiliREC</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/logo.png">
  
  <!-- 防闪烁：在渲染前尽早设置主题 -->
  <script>
    document.documentElement.setAttribute('data-theme', (function(){
      try {
        var t = localStorage.getItem('xigem-theme');
        return t === 'dark' ? 'dark' : 'light';
      } catch(e) { return 'light'; }
    })());
  </script>
  <style>
    /* 针对长文件名的截断 */
    .file-name {
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    /* 表格行悬浮高亮 */
    .data-table tbody tr {
      transition: background var(--transition-fast);
    }
    [data-theme="light"] .data-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    [data-theme="dark"] .data-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* 操作列按钮间距 */
    .action-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* 标签页样式 */
    .tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    /* 标签按钮：覆盖全局按钮样式 */
    .tabs .tab-btn,
    .tabs .tab-btn:hover,
    .tabs .tab-btn:focus,
    .tabs .tab-btn:focus-visible,
    .tabs .tab-btn:active {
      appearance: none !important;
      background: transparent !important;
      background-color: transparent !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      outline: none !important;
      box-shadow: none !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
      transform: none !important;
      border-radius: 0 !important;
    }

    .tabs .tab-btn {
      border-bottom: 2px solid transparent !important;
      padding: 12px 16px !important;
      color: var(--color-text-muted) !important;
      font-size: var(--text-body-lg);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
      text-decoration: none !important;
    }

    .tabs .tab-btn:hover {
      color: var(--color-text) !important;
    }

    .tabs .tab-btn.active {
      color: var(--color-blurple) !important;
      border-bottom-color: var(--color-blurple) !important;
      font-weight: var(--font-weight-semibold);
    }

    [data-theme="dark"] .tabs .tab-btn.active {
      color: var(--color-champagne) !important;
      border-bottom-color: var(--color-champagne) !important;
    }

    /* 搜索框 */
    .search-bar {
      max-width: 300px;
      width: 100%;
    }

    /* 刷新按钮：与首页保持一致 */
    .refresh-btn {
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* 统一去掉所有 <a> 标签作为按钮时的下划线 */
    a.btn, a.badge {
      text-decoration: none !important;
    }

    /* 主播昵称链接样式 */
    .anchor-badge {
      text-decoration: none !important;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .anchor-badge:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-raised-hover) !important;
    }
  </style>
</head>
<body>
  <div data-include="header"></div>

  <main class="page-main">
    <div class="container">

      <!-- 标题与工具栏 -->
      <div class="flex justify-between items-center mb-24" style="flex-wrap: wrap; gap:16px;">
        <div>
          <p class="label">Library</p>
          <h1 class="heading" style="margin:0;">媒体库</h1>
        </div>

        <div class="flex gap-16 items-center" style="flex-wrap: wrap;">
          <!-- 仅管理员可见的删除模式开关 -->
          <div class="hidden flex items-center gap-8" id="adminTool">
            <label style="margin:0; cursor:pointer; display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="deleteModeToggle" style="width:auto; margin:0; box-shadow:none; padding:0;">
              <span class="text-muted" style="font-size:var(--text-body);">开启原片删除</span>
            </label>
          </div>
          <button class="btn refresh-btn" id="refreshBtn" type="button" title="刷新数据">↻</button>
        </div>
      </div>

      <!-- 标签页切换 -->
      <div class="tabs">
        <button type="button" class="tab-btn active" data-target="recordings">录屏原片</button>
        <button type="button" class="tab-btn" data-target="clips">我的切片</button>
      </div>

      <!-- 录屏列表视图 -->
      <div id="recordingsView">
        <div class="mb-16 flex justify-between items-center" style="flex-wrap: wrap; gap:16px;">
          <input type="text" id="searchInput" class="search-bar" placeholder="搜索主播昵称或房间号...">
        </div>

        <div class="card card-static" style="padding:0; overflow:hidden;">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>主播</th>
                  <th>文件标识 (File ID)</th>
                  <th>大小</th>
                  <th>录制时间</th>
                  <th>状态</th>
                  <th style="text-align:right;">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- 渲染内容 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 我的切片视图（初始隐藏） -->
      <div id="clipsView" class="hidden">
        <div class="card card-static" style="padding:0; overflow:hidden;">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>切片名称</th>
                  <th>大小</th>
                  <th>生成时间</th>
                  <th style="text-align:right;">操作</th>
                </tr>
              </thead>
              <tbody id="clipsBody">
                <!-- 渲染内容 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div data-include="footer"></div>
  <script src="/theme.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tableBody = document.getElementById('tableBody');
      const clipsBody = document.getElementById('clipsBody');
      const refreshBtn = document.getElementById('refreshBtn');
      const adminTool = document.getElementById('adminTool');
      const deleteModeToggle = document.getElementById('deleteModeToggle');
      const searchInput = document.getElementById('searchInput');
      const tabBtns = document.querySelectorAll('.tab-btn');
      const recordingsView = document.getElementById('recordingsView');
      const clipsView = document.getElementById('clipsView');

      let isAdmin = false;
      let isDeleteMode = false;
      let allRecordings = [];
      let currentTab = 'recordings';

      // 1. 检查当前用户权限
      try {
        const me = await XIGEM.api('/api/me');
        if (me.username === '#admin#' && me.adminAuthenticated) {
          isAdmin = true;
          adminTool.classList.remove('hidden');
        }
      } catch (e) {
        console.warn('获取用户信息失败', e);
      }

      // 2. 加载录屏列表数据
      async function loadRecordings() {
        XIGEM.setLoading(tableBody, '正在获取录屏列表...');
        try {
          const res = await XIGEM.api('/api/recordings');
          allRecordings = res.items || [];
          renderRecordings();
        } catch (e) {
          XIGEM.setEmpty(tableBody, '加载失败', e.message);
        }
      }

      // 3. 加载切片列表数据
      async function loadClips() {
        XIGEM.setLoading(clipsBody, '正在获取切片列表...');
        try {
          const res = await XIGEM.api('/api/clips/mine');
          renderClips(res.items || []);
        } catch (e) {
          XIGEM.setEmpty(clipsBody, '加载失败', e.message);
        }
      }

      // 4. 渲染录屏表格
      function renderRecordings() {
        const keyword = searchInput.value.trim().toLowerCase();
        let filtered = allRecordings;

        if (keyword) {
          filtered = allRecordings.filter(item => {
            const roomId = String(item.roomId || '').toLowerCase();
            const fileId = String(item.fileId || '').toLowerCase();
            const nick = String(item.nick || '').toLowerCase();

            return roomId.includes(keyword) ||
                   fileId.includes(keyword) ||
                   nick.includes(keyword);
          });
        }

        if (!filtered.length) {
          XIGEM.setEmpty(tableBody, '没有找到录屏', keyword ? '换个关键词试试吧。' : '还没有录制任务完成。');
          return;
        }

        filtered.sort((a, b) => b.createdAt - a.createdAt);

        let html = '';

        for (const item of filtered) {
          const roomId = String(item.roomId || '');
          const fileId = String(item.fileId || '');
          const fileName = String(item.fileName || fileId);
          const nick = String(item.nick || '未知主播');

          const sizeStr = formatSize(item.size);
          const dateStr = formatDate(item.createdAt);

          let badgeClass = 'badge-ready';
          let statusText = 'Ready';
          let canPlay = true;

          if (item.status === 'recording') {
            badgeClass = 'badge-recording';
            statusText = 'Recording';
            canPlay = false;
          } else if (item.status === 'transcoding') {
            badgeClass = 'badge-transcoding';
            statusText = 'Transcoding';
            canPlay = false;
          }

          const playBtn = canPlay
            ? `<a href="/video?file=${encodeURIComponent(fileId)}" class="btn btn-primary" style="padding: 6px 16px; font-size: 12px;">播放/切片</a>`
            : `<button class="btn" disabled style="padding: 6px 16px; font-size: 12px;">请稍候</button>`;

          const deleteBtn = (isAdmin && isDeleteMode)
            ? `
              <button
                class="btn btn-danger btn-del"
                data-room="${XIGEM.escapeHtml(roomId)}"
                data-file="${XIGEM.escapeHtml(fileId)}"
                data-name="${XIGEM.escapeHtml(fileName)}"
                type="button"
                style="padding: 6px 16px; font-size: 12px;"
              >删除</button>
            `
            : '';

          html += `
            <tr>
              <td>
                <a
                  href="https://live.bilibili.com/${encodeURIComponent(roomId)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="badge badge-ready anchor-badge"
                >
                  ${XIGEM.escapeHtml(nick)}
                </a>
              </td>
              <td>
                <span class="file-name" title="${XIGEM.escapeHtml(fileName)}">${XIGEM.escapeHtml(fileName)}</span>
              </td>
              <td>${sizeStr}</td>
              <td>${dateStr}</td>
              <td><span class="badge ${badgeClass}">${statusText}</span></td>
              <td>
                <div class="action-btns">
                  ${playBtn}
                  ${deleteBtn}
                </div>
              </td>
            </tr>
          `;
        }

        tableBody.innerHTML = html;
      }

      // 5. 渲染我的切片
      function renderClips(items) {
        if (!Array.isArray(items) || !items.length) {
          XIGEM.setEmpty(clipsBody, '暂无切片', '你还没有切过视频，去录屏列表里挑一个吧。');
          return;
        }

        let html = '';

        for (const item of items) {
          const name = String(item.name || '');
          const sizeStr = formatSize(item.size);
          const dateStr = formatDate(item.createdAt);
          const downloadUrl = getSafeDownloadUrl(item.downloadUrl);

          html += `
            <tr>
              <td>
                <span class="file-name" title="${XIGEM.escapeHtml(name)}">${XIGEM.escapeHtml(name)}</span>
              </td>
              <td>${sizeStr}</td>
              <td>${dateStr}</td>
              <td>
                <div class="action-btns">
                  <a
                    href="${XIGEM.escapeHtml(downloadUrl)}"
                    class="btn btn-primary"
                    style="padding: 6px 16px; font-size: 12px;"
                    target="_blank"
                    rel="noopener noreferrer"
                  >下载</a>

                  <button
                    class="btn btn-danger btn-clip-del"
                    data-name="${XIGEM.escapeHtml(name)}"
                    type="button"
                    style="padding: 6px 16px; font-size: 12px;"
                  >删除</button>
                </div>
              </td>
            </tr>
          `;
        }

        clipsBody.innerHTML = html;
      }

            // 原片删除：事件委托
      tableBody.addEventListener('click', e => {
        const button = e.target.closest('.btn-del');

        if (!button || !tableBody.contains(button)) {
          return;
        }

        confirmDelete(
          button.dataset.room,
          button.dataset.file,
          button.dataset.name
        );
      });

      // 切片删除：事件委托
      clipsBody.addEventListener('click', e => {
        const button = e.target.closest('.btn-clip-del');

        if (!button || !clipsBody.contains(button)) {
          return;
        }

        confirmDeleteClip(button.dataset.name);
      });

      // 6. 格式化文件大小
      function formatSize(bytes) {
        const value = Number(bytes);

        if (!Number.isFinite(value) || value <= 0) {
          return '0 B';
        }

        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];

        const i = Math.min(
          Math.floor(Math.log(value) / Math.log(k)),
          sizes.length - 1
        );

        return parseFloat(
          (value / Math.pow(k, i)).toFixed(2)
        ) + ' ' + sizes[i];
      }

      // 格式化日期
      function formatDate(value) {
        const date = new Date(value);

        if (!Number.isFinite(date.getTime())) {
          return '-';
        }

        return date.toLocaleString('zh-CN', {
          hour12: false
        });
      }

      // 验证切片下载地址
      function getSafeDownloadUrl(value) {
        const raw = String(value || '');

        if (!raw || raw.includes('\\')) {
          return '#';
        }

        try {
          const url = new URL(
            raw.startsWith('/') ? raw : '/' + raw,
            window.location.origin
          );

          if (url.origin !== window.location.origin) {
            return '#';
          }

          return url.pathname + url.search + url.hash;

        } catch (e) {
          return '#';
        }
      }

      // 7. 删除确认：原片
      function confirmDelete(roomId, fileId, fileName) {
        XIGEM.openModal({
          title: '⚠️ 确认删除原片',
            content: `
            <p style="line-height:1.6;">
              确定要删除 <strong>${XIGEM.escapeHtml(fileName)}</strong> 吗？
            </p>
            <p class="text-muted" style="font-size:12px; margin-top:8px;">
              此操作将同时删除对应的 HLS 预览文件，且无法恢复。
            </p>
          `,
          confirmText: '永久删除',
          cancelText: '取消',
          onConfirm: async (overlay) => {
            const btn = overlay.querySelector('[data-modal-confirm]');
            btn.textContent = '删除中...';
            btn.disabled = true;

            try {
              await XIGEM.api(
                `/api/admin/recordings/${encodeURIComponent(roomId)}/${encodeURIComponent(fileId)}`,
                {
                  method: 'DELETE'
                }
              );
              XIGEM.toast('删除成功', 'success');
              loadRecordings();
              return true;
            } catch (e) {
              XIGEM.toast(e.message || '删除失败', 'error');
              btn.textContent = '永久删除';
              btn.disabled = false;
              return false;
            }
          }
        });
      }

      // 8. 删除确认：切片
      function confirmDeleteClip(fileName) {
        XIGEM.openModal({
          title: '⚠️ 删除切片',
          content: `
            <p style="line-height:1.6;">
              确定要删除切片 <strong>${XIGEM.escapeHtml(fileName)}</strong> 吗？
            </p>
          `,
          confirmText: '删除',
          cancelText: '取消',
          onConfirm: async (overlay) => {
            const btn = overlay.querySelector('[data-modal-confirm]');
            btn.textContent = '删除中...';
            btn.disabled = true;

            try {
              await XIGEM.api(`/api/clips/${encodeURIComponent(fileName)}`, { method: 'DELETE' });
              XIGEM.toast('切片删除成功', 'success');
              loadClips();
              return true;
            } catch (e) {
              XIGEM.toast(e.message || '删除失败', 'error');
              btn.textContent = '删除';
              btn.disabled = false;
              return false;
            }
          }
        });
      }

      // 9. 事件绑定
      refreshBtn.addEventListener('click', () => {
        refreshBtn.textContent = '↻';
        refreshBtn.style.animation = 'spin 0.8s linear infinite';

        const refreshTask = currentTab === 'recordings'
          ? loadRecordings()
          : loadClips();

        refreshTask.finally(() => {
          setTimeout(() => {
            refreshBtn.style.animation = 'none';
          }, 500);
        });
      });

      searchInput.addEventListener('input', () => {
        renderRecordings();
      });

      deleteModeToggle.addEventListener('change', (e) => {
        isDeleteMode = e.target.checked;
        renderRecordings();
      });

      // 切换标签页
      function switchTab(tab) {
        currentTab = tab === 'clips' ? 'clips' : 'recordings';

        tabBtns.forEach(btn => {
          btn.classList.toggle(
            'active',
            btn.dataset.target === currentTab
          );
        });

        if (currentTab === 'clips') {
          recordingsView.classList.add('hidden');
          clipsView.classList.remove('hidden');

          loadClips();
        } else {
          clipsView.classList.add('hidden');
          recordingsView.classList.remove('hidden');

          loadRecordings();
        }

        const url = new URL(window.location.href);

        if (currentTab === 'clips') {
          url.searchParams.set('tab', 'clips');
        } else {
          url.searchParams.delete('tab');
        }

        window.history.replaceState(null, '', url);
      }

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.dataset.target);
        });
      });

      // 根据 URL 参数初始化标签页
      const initialTab =
        new URLSearchParams(window.location.search).get('tab');

      switchTab(initialTab);
    });
  </script>
</body>
</html>
